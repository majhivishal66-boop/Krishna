
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Strike Tic-Tac-Toe (Python)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-glow-x { text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6; color: #60a5fa !important; }
        .neon-glow-o { text-shadow: 0 0 10px #f43f5e, 0 0 20px #f43f5e; color: #fb7185 !important; }
        .neon-border-blue { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); border-color: #3b82f6 !important; background: rgba(59,130,246,0.1); }
        .neon-border-rose { box-shadow: 0 0 15px rgba(244, 63, 94, 0.5); border-color: #f43f5e !important; background: rgba(244,63,94,0.1); }
        .grid-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }
        .square {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .square:disabled { cursor: default; }
        py-script { display: none; }
    </style>
</head>
<body class="grid-bg min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8 md:py-16">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-6xl font-orbitron font-bold tracking-tighter text-white mb-2">
                NEON <span class="text-blue-500">STRIKE</span>
            </h1>
            <p class="text-slate-400 font-medium uppercase tracking-[0.2em] text-xs">
                Python Engine • Minimax AI
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            <!-- Sidebar -->
            <div class="lg:col-span-4 space-y-6 order-2 lg:order-1">
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-orbitron">Stats</h3>
                        <button id="btn-reset-scores" class="text-[10px] bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-1 rounded uppercase font-bold transition-colors">
                            Reset All
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-3 rounded-lg bg-blue-500/10 border border-blue-500/20">
                            <span class="font-medium text-blue-400">X Wins</span>
                            <span id="score-x" class="text-xl font-orbitron">0</span>
                        </div>
                        <div class="flex justify-between items-center p-3 rounded-lg bg-rose-500/10 border border-rose-500/20">
                            <span class="font-medium text-rose-400">O Wins</span>
                            <span id="score-o" class="text-xl font-orbitron">0</span>
                        </div>
                        <div class="flex justify-between items-center p-3 rounded-lg bg-slate-500/10 border border-slate-500/20 text-slate-400">
                            <span class="font-medium">Draws</span>
                            <span id="score-draws" class="text-xl font-orbitron">0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm">
                    <h3 class="text-lg font-orbitron mb-4">Mode</h3>
                    <button id="btn-mode" class="w-full flex items-center justify-between p-4 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 transition-colors group">
                        <span id="mode-text" class="font-semibold text-purple-400">Vs Python AI</span>
                        <span class="text-[10px] text-slate-500 uppercase font-bold">Change</span>
                    </button>
                </div>
            </div>

            <!-- Board -->
            <div class="lg:col-span-8 space-y-8 order-1 lg:order-2">
                <div class="flex items-center justify-between">
                    <div id="status-badge" class="px-6 py-2 rounded-full border-2 border-blue-500 bg-blue-500/10 shadow-[0_0_15px_rgba(59,130,246,0.3)] font-orbitron font-bold text-sm transition-all duration-300">
                        X'S TURN
                    </div>
                    <button id="btn-reset-game" class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-all font-bold text-xs uppercase tracking-wider">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                        Reset Game
                    </button>
                </div>

                <div class="grid grid-cols-3 gap-3 md:gap-4 p-4 rounded-2xl bg-slate-950/80 border border-slate-800 shadow-2xl relative" id="game-grid">
                    <button id="sq-0" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-1" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-2" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-3" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-4" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-5" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-6" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-7" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                    <button id="sq-8" class="square w-full h-24 md:h-32 flex items-center justify-center text-4xl md:text-6xl font-orbitron rounded-lg border-2 border-slate-800 bg-slate-900/50 hover:bg-slate-800/80"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Winner Overlay -->
    <div id="winner-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md">
        <div class="text-center p-8">
            <h2 id="winner-text" class="text-5xl md:text-7xl font-orbitron font-bold mb-4">X WINS</h2>
            <button id="btn-play-again" class="px-8 py-4 bg-white text-slate-950 font-bold rounded-xl hover:bg-slate-200 transition-colors uppercase tracking-widest text-sm">
                Next Match
            </button>
        </div>
    </div>

    <script type="py" src="./main.py" config="./pyscript.json"></script>
</body>
</html>
